name: ev_ride
description: EV Ride-Hailing App — Electric Rides, Smarter City

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── HTTP, Storage & Real-time ───────────────────────
  http: ^1.6.0
  shared_preferences: ^2.5.5
  socket_io_client: ^2.0.3+1  # <--- Real-time matching ke liye zaroori

  # ── Google & Location Services ──────────────────────
  google_sign_in: ^6.2.1
  google_maps_flutter: ^2.17.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # ── UI Utilities & Extras ───────────────────────────
  flutter_screenutil: ^5.9.0
  shimmer: ^3.0.0             # <--- Premium UI loading effects ke liye
  cupertino_icons: ^1.0.6
  pin_code_fields: ^8.0.1
  
  # ── New Additions for Production Features ───────────
  url_launcher: ^6.3.0        # <--- SOS Button (Dial 15) ke liye zaroori
  cached_network_image: ^3.3.1 # <--- Profile Avatars smoothly load karne ke liye
  image_picker: ^1.2.2
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0
  google_maps_flutter_web: ^0.6.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true