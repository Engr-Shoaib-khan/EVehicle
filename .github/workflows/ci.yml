name: CI Pipeline

on:
  push:
    branches: ["**"] # Run on all branches
  pull_request:
    branches: [ main ] # Run on PRs to main

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret_key # Dummy secret for tests

  flutter-analysis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ev_ride_app
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          cache: true
          
      - run: flutter pub get
      - run: flutter analyze
